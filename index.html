<html lang="en">
  <head>
    <link rel="stylesheet" href="style.css" />
    <script src="/scripts/popup.js"></script>
  </head>
  <body>
    <div class="Container">
      <p>Temps de travail :</p>
      <div class="timeContainer">
        <button id="workMin">-</button>
        <input id="workTime" type="number" value="25" min="1" /> min
        <button id="workPlus">+</button>
      </div>
      <p>Temps de pause :</p>
      <div class="timeContainer">
        <button id="breakMin">-</button>
        <input id="workTimeBreak" type="number" value="5" min="1" /> min
        <button id="breakPlus">+</button>
      </div>
      <button id="start" class="startButton">Commencer</button>
    </div>
  </body>
</html>
